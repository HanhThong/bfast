name: Release

# Pushing an extension version tag (v1.2.0, or v1.3.0-rc.1 for a pre-release) on a commit of master releases the
# extension and its documentation together: the tag is checked against package.json, the whole test suite runs on the
# tagged commit, the VSIX is built, the documentation site of that same commit is deployed to its Cloudflare Worker
# (docs.yml — production, or a preview version for a pre-release), and only then is the GitHub Release created with the VSIX
# and its checksum attached. GitHub attaches the source code (zip and tar.gz) to every release on its own. A run that
# fails before the release leaves none behind and can be re-run for the same tag. A docs-only fix between two
# extension versions is a docs-v* tag, released by docs-release.yml. RELEASING.md is the guide.
#
# Settings it needs: the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the repository's
# Actions variable DOCS_URL (web-docs/RELEASING.md §One-time setup).
on:
  push:
    tags: ['v[0-9]*']

# One run per version at a time: a second one waits, and never releases beside the first.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # Every branch, to tell whether the tagged commit is on master.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Check the version, its commit and the settings
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Not a version::$TAG is not v<major>.<minor>.<patch>, as v1.2.0 or v1.3.0-rc.1."
            exit 1
          fi
          version="${TAG#v}"
          prerelease=$([ -n "${BASH_REMATCH[2]}" ] && echo true || echo false)
          # The VSIX takes its version from package.json, so a tag naming another one would release a mislabelled file.
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$version" ]; then
            echo "::error title=Version mismatch::$TAG does not match package.json's version $declared. Bump package.json (npm version $version --no-git-tag-version), commit, and tag that commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error title=Not on master::$TAG names a commit that is not on master."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error title=Already released::$TAG has a GitHub Release already, which a release never replaces."
            exit 1
          fi
          # The documentation is released with the extension, so its settings are checked before anything is built.
          if [ -z "$DOCS_URL" ]; then
            echo "::error title=DOCS_URL is not set::Set the repository variable DOCS_URL (Settings → Secrets and variables → Actions → Variables) to the documentation site's address, then re-run."
            exit 1
          fi
          if [ "$HAS_API_TOKEN" != true ] || [ "$HAS_ACCOUNT_ID" != true ]; then
            echo "::error title=Cloudflare is not set up::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions → Secrets), then re-run."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # The suite ci.yml runs, on the tagged commit itself: a tag never releases what the tests refuse.
  test:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compile, type-check the webview, both bundle guards and lint (`pretest`), then every suite in a real VS Code.
      - run: npm test

  package:
    name: VSIX
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSIX: bfast-${{ needs.version.outputs.version }}.vsix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `vscode:prepublish` runs the production build (compiled host, minified webview, no sourcemaps) first.
      - name: Build the VSIX
        run: |
          npm run vsix -- --out "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          {
            echo "### VSIX"
            echo "- \`$VSIX\` ($(du -h "$VSIX" | cut -f1))"
            echo "- sha256 \`$(cut -d' ' -f1 "$VSIX.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            ${{ env.VSIX }}
            ${{ env.VSIX }}.sha256
          if-no-files-found: error
          retention-days: 30

  # The documentation of the tagged commit, deployed once the VSIX is built: to production, or to a preview for a
  # pre-release, so the live site never runs ahead of the extension it documents.
  docs:
    name: Documentation
    needs: [version, package]
    uses: ./.github/workflows/docs.yml
    secrets: inherit
    with:
      deploy: true
      production: ${{ needs.version.outputs.prerelease != 'true' }}

  release:
    name: GitHub Release
    needs: [version, package, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The tagged commit, for CHANGELOG.md when the repository has one.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      # The notes: the version's own section of CHANGELOG.md when there is one, then what GitHub writes from the pull
      # requests merged since the previous extension version (never a docs-v* tag).
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          DOCS_URL: ${{ vars.DOCS_URL }}
          DOCS_DEPLOYMENT_URL: ${{ needs.docs.outputs.url }}
        run: |
          vsix="bfast-$VERSION.vsix"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          previous=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | grep -E '^v[0-9]' | grep -vx "$TAG" | sort -V | tail -n 1 || true)
          if [ -n "$previous" ]; then flags+=(--notes-start-tag "$previous"); fi
          # Everything under "## [<version>]" up to the next "## " heading. The repository need not keep a CHANGELOG.md:
          # without one the notes are GitHub's alone.
          changes=""
          if [ -f CHANGELOG.md ]; then
            changes=$(awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          install="Install: download \`$vsix\`, then in VS Code **Extensions → … → Install from VSIX…**, or \`code --install-extension $vsix\`."
          if [ "$PRERELEASE" = true ]; then
            install+=$'\n\n'"Documentation (preview of this version): $DOCS_DEPLOYMENT_URL"
          else
            install+=$'\n\n'"Documentation: $DOCS_URL"
          fi
          notes="$install"
          if [ -n "$(echo "$changes" | tr -d '[:space:]')" ]; then
            notes="$changes"$'\n\n'"$install"
          elif [ -f CHANGELOG.md ]; then
            echo "::warning title=No changelog entry::CHANGELOG.md has no \"## [$VERSION]\" section; the notes are GitHub's alone."
          fi
          gh release create "$TAG" "$vsix" "$vsix.sha256" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "BFAST $TAG" --notes "$notes" --generate-notes "${flags[@]}"
